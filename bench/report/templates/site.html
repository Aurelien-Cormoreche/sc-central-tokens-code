<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single-cell FM benchmark</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #006300; --warn-bg: #fff4d6; --warn-ink: #5a4100; --crit: #d03b3b;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #0ca30c; --warn-bg: #3a2f10; --warn-ink: #f5d78a; --crit: #e66767; --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #0ca30c; --warn-bg: #3a2f10; --warn-ink: #f5d78a; --crit: #e66767; --accent: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.bar { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.bar h1 { font-size: 16px; margin: 0; font-weight: 600; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { color: var(--ink-2); text-decoration: none; padding: 6px 10px; border-radius: 6px; }
nav a.on { background: var(--wash); color: var(--ink); font-weight: 600; }
nav a:hover { background: var(--wash); }
.meta { color: var(--muted); font-size: 12px; margin-left: auto; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin: 0 0 16px; }
h2 { font-size: 15px; margin: 0 0 4px; } h3 { font-size: 14px; margin: 16px 0 6px; }
p.sub { color: var(--ink-2); margin: 0 0 12px; max-width: 900px; }
.filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin: 0 0 12px; }
.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--ink-2); gap: 2px; }
select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; } button:hover { background: var(--wash); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--wash); }
td.best { font-weight: 700; }
td.hm { cursor: pointer; border: 2px solid var(--surface); border-radius: 4px; min-width: 64px; text-align: center; }
td.hm:hover, td.hm:focus { outline: 2px solid var(--ink); outline-offset: -2px; }
.tools { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; gap: 8px; }
.tools .cap { color: var(--muted); font-size: 12px; }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
.pill { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 12px; border: 1px solid var(--axis); color: var(--ink-2); }
.state-done { color: var(--good); } .state-failed { color: var(--crit); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 4px 0; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
svg text { fill: var(--muted); font-size: 11px; }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); font-size: 12px; display: none; max-width: 320px; }
#tip b { font-variant-numeric: tabular-nums; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 30; align-items: flex-start; justify-content: center; overflow: auto; padding: 32px 16px; }
#modal .box { background: var(--surface); border-radius: 10px; padding: 16px; max-width: 1100px; width: 100%; }
#modal .close { float: right; }
.empty { color: var(--muted); padding: 12px 0; }
@media (max-width: 640px) { .meta { margin-left: 0; } td.hm { min-width: 48px; } }
</style>
</head>
<body>
<header><div class="bar">
  <h1>Single-cell FM benchmark</h1>
  <nav id="nav"></nav>
  <span class="meta" id="meta"></span>
</div></header>
<main id="main"></main>
<div id="tip" role="tooltip"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="modalbox"></div></div>
<script id="bench-data" type="application/json">/*__BENCH_DATA__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("bench-data").textContent) || {};
const M = D.meta || {};
const METRICS = ["macro_f1_present", "balanced_accuracy", "accuracy", "macro_f1", "weighted_f1", "slide_mean_macro_f1_present"];
const MLABEL = {macro_f1_present: "macro F1 (present classes)", balanced_accuracy: "balanced accuracy", accuracy: "accuracy",
  macro_f1: "macro F1 (all classes)", weighted_f1: "weighted F1", slide_mean_macro_f1_present: "macro F1, mean over slides"};
const PAGES = [["overview", "Overview"], ["stage1", "Stage 1"], ["stage2", "Stage 2"], ["stage3", "Stage 3"], ["status", "Run status"]];
const SEQ = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"];

// ── helpers ──
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const svgEl = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); return e; };
const f3 = v => v == null || Number.isNaN(v) ? "–" : Number(v).toFixed(3);
const pct = v => v == null ? "–" : (100 * v).toFixed(1);
const uniq = a => [...new Set(a)];
const mean = a => { const v = a.filter(x => x != null && !Number.isNaN(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const std = a => { const v = a.filter(x => x != null); if (v.length < 2) return 0; const m = mean(v); return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1)); };
const isDark = () => document.documentElement.dataset.theme === "dark" ||
  (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
const metricOf = (row, m) => row ? row[m] : null;
const mr = r => `${r.model} · ${r.readout}`;
const taskLabel = t => t ? t.replace("within:", "").replace("cross:", "held-out ").replace("single:", "train ") : "";

function tip(evt, nodes) {
  const t = document.getElementById("tip"); t.replaceChildren(...nodes); t.style.display = "block";
  const x = Math.min(evt.clientX + 14, innerWidth - t.offsetWidth - 8), y = Math.min(evt.clientY + 14, innerHeight - t.offsetHeight - 8);
  t.style.left = x + "px"; t.style.top = y + "px";
}
const untip = () => { document.getElementById("tip").style.display = "none"; };

function csv(cols, rows) {
  const q = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.map(c => q(c.label || c.key)).join(","), ...rows.map(r => cols.map(c => q(c.csv ? c.csv(r) : r[c.key])).join(","))].join("\n");
}
function download(name, text) {
  const a = el("a", {href: URL.createObjectURL(new Blob([text], {type: "text/csv"})), download: name}); document.body.append(a); a.click(); a.remove();
}
// cols: [{key, label, fmt, cls, csv}]
function table(cols, rows, {name = "table", caption = "", onRow = null, best = null} = {}) {
  const head = el("tr", {}, cols.map(c => el("th", {class: c.cls || ""}, c.label || c.key)));
  const body = rows.map(r => el("tr", {class: onRow ? "click" : "", onclick: onRow ? () => onRow(r) : null, tabindex: onRow ? 0 : null},
    cols.map(c => el("td", {class: (c.cls || "") + (best && best(r, c) ? " best" : "")}, c.fmt ? c.fmt(r[c.key], r) : (r[c.key] ?? "–")))));
  const tools = el("div", {class: "tools"}, el("span", {class: "cap"}, caption),
    el("button", {onclick: () => download(name + ".csv", csv(cols, rows)), title: "Download this table as CSV"}, "CSV"));
  return el("div", {}, tools, rows.length ? el("div", {class: "tablewrap"}, el("table", {}, el("thead", {}, head), el("tbody", {}, body)))
    : el("div", {class: "empty"}, "No results yet."));
}
function select(label, options, value, onchange) {
  const s = el("select", {onchange: e => onchange(e.target.value)}, options.map(o => {
    const [v, t] = Array.isArray(o) ? o : [o, o]; return el("option", {value: v, selected: String(v) === String(value)}, t); }));
  return el("label", {}, label, s);
}
function modal(title, ...content) {
  const box = document.getElementById("modalbox");
  box.replaceChildren(el("button", {class: "close", onclick: closeModal}, "Close"), el("h2", {}, title), ...content);
  document.getElementById("modal").style.display = "flex";
}
function closeModal() { document.getElementById("modal").style.display = "none"; }
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// sequential colour for a value in [lo, hi]
function seqColor(v, lo, hi) {
  if (v == null) return [null, null];
  const t = hi > lo ? (v - lo) / (hi - lo) : 0.5;
  const ramp = isDark() ? [...SEQ].reverse() : SEQ;
  const i = Math.max(0, Math.min(SEQ.length - 1, Math.round(t * (SEQ.length - 1))));
  const darkFill = isDark() ? i < 7 : i >= 6;
  return [ramp[i], darkFill ? "#ffffff" : "#0b0b0b"];
}
// rows: [{label, key}], cols: [{label, key}], get(rk, ck) -> {v, ci, n} ; onClick(rk, ck)
function heatmap(rows, cols, get, {name, caption, onClick, fmt = f3} = {}) {
  const vals = []; rows.forEach(r => cols.forEach(c => { const g = get(r.key, c.key); if (g && g.v != null) vals.push(g.v); }));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const colBest = {}; cols.forEach(c => { colBest[c.key] = Math.max(...rows.map(r => (get(r.key, c.key) || {}).v ?? -Infinity)); });
  const head = el("tr", {}, el("th", {class: "l"}, ""), cols.map(c => el("th", {}, c.label)));
  const body = rows.map(r => el("tr", {}, el("td", {class: "l"}, r.label), cols.map(c => {
    const g = get(r.key, c.key) || {}; const [bg, fg] = seqColor(g.v, lo, hi);
    const best = g.v != null && g.v === colBest[c.key];
    const td = el("td", {class: "hm" + (best ? " best" : ""), tabindex: 0, style: bg ? `background:${bg};color:${fg}` : "",
      onclick: () => onClick && g.v != null && onClick(r.key, c.key)}, g.v == null ? "–" : fmt(g.v) + (best ? " ▲" : ""));
    const show = e => tip(e, [el("div", {}, el("b", {}, g.v == null ? "no result" : fmt(g.v)), " ", r.label),
      el("div", {}, c.label), g.ci && g.ci[0] != null ? el("div", {}, `95% CI over donors ${fmt(g.ci[0])}–${fmt(g.ci[1])}`) : "",
      g.n ? el("div", {}, `${g.n}`) : "", onClick && g.v != null ? el("div", {style: "color:var(--muted)"}, "click for per-class F1 and confusion") : ""]);
    td.addEventListener("pointermove", show); td.addEventListener("pointerleave", untip);
    td.addEventListener("focus", e => { const b = td.getBoundingClientRect(); show({clientX: b.right, clientY: b.top}); });
    td.addEventListener("blur", untip);
    td.addEventListener("keydown", e => { if (e.key === "Enter" && onClick && g.v != null) onClick(r.key, c.key); });
    return td; })));
  const flat = []; rows.forEach(r => cols.forEach(c => { const g = get(r.key, c.key) || {};
    flat.push({row: r.label, column: c.label, value: g.v, ci_lo: g.ci ? g.ci[0] : null, ci_hi: g.ci ? g.ci[1] : null}); }));
  const tools = el("div", {class: "tools"}, el("span", {class: "cap"}, caption || "▲ = best in column"),
    el("button", {onclick: () => download((name || "heatmap") + ".csv", csv([{key: "row"}, {key: "column"}, {key: "value"}, {key: "ci_lo"}, {key: "ci_hi"}], flat))}, "CSV"));
  return el("div", {}, tools, vals.length ? el("div", {class: "tablewrap"}, el("table", {}, el("thead", {}, head), el("tbody", {}, body)))
    : el("div", {class: "empty"}, "No results yet."));
}
// series: [{name, color, points: [{x, y, lo, hi}]}]
// "nice" ticks (1/2/5 x 10^k) covering [lo, hi]; metric values are clamped to [0, 1]
function niceTicks(lo, hi, n = 4) {
  if (hi - lo < 1e-9) { lo -= 0.01; hi += 0.01; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map(f => f * mag).find(s => s >= raw) || 10 * mag;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step;
  const dec = Math.max(0, -Math.floor(Math.log10(step)));
  const ticks = []; for (let v = a; v <= b + step / 2; v += step) ticks.push(+v.toFixed(dec + 2));
  return {ticks, dec};
}
function lineChart(series, {xLog = 10, xFmt = String, yLabel = "", xLabel = "", height = 260, width = 640, bounded = true} = {}) {
  const W = width, H = height, L = 64, R = 16, T = 12, B = 40;
  const pts = series.flatMap(s => s.points);
  if (!pts.length) return el("div", {class: "empty"}, "No results yet.");
  const xs = uniq(pts.map(p => p.x)).sort((a, b) => a - b);
  const lx = x => Math.log(x) / Math.log(xLog);
  const x0 = lx(xs[0]), x1 = lx(xs[xs.length - 1]);
  const X = x => xs.length === 1 ? (L + W - R) / 2 : L + (lx(x) - x0) / (x1 - x0) * (W - L - R);
  let lo = Math.min(...pts.map(p => p.lo ?? p.y)), hi = Math.max(...pts.map(p => p.hi ?? p.y));
  const {ticks, dec} = niceTicks(bounded ? Math.max(0, lo) : lo, bounded ? Math.min(1, hi) : hi);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const Y = y => T + (1 - (Math.min(Math.max(y, y0), y1) - y0) / (y1 - y0)) * (H - T - B);
  // drawn at its own size: never scaled up past ~1.15x, so text stays ~11-13 px
  const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${Math.round(W * 1.15)}px;display:block`,
    role: "img", "aria-label": yLabel + " vs " + xLabel});
  ticks.forEach(v => { const yy = Y(v);
    svg.append(svgEl("line", {x1: L, x2: W - R, y1: yy, y2: yy, stroke: "var(--grid)", "stroke-width": 1}));
    const t = svgEl("text", {x: L - 6, y: yy + 4, "text-anchor": "end"}); t.textContent = v.toFixed(dec); svg.append(t); });
  svg.append(svgEl("line", {x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "var(--axis)", "stroke-width": 1}));
  xs.forEach(x => { const t = svgEl("text", {x: X(x), y: H - B + 16, "text-anchor": "middle"}); t.textContent = xFmt(x); svg.append(t); });
  const xl = svgEl("text", {x: (L + W - R) / 2, y: H - 6, "text-anchor": "middle"}); xl.textContent = xLabel; svg.append(xl);
  const yl = svgEl("text", {x: 12, y: (T + H - B) / 2, transform: `rotate(-90 12 ${(T + H - B) / 2})`, "text-anchor": "middle"}); yl.textContent = yLabel; svg.append(yl);
  series.forEach(s => {
    const p = [...s.points].sort((a, b) => a.x - b.x);
    p.forEach(q => { if (q.lo != null && q.hi != null && q.hi > q.lo) {
      svg.append(svgEl("line", {x1: X(q.x), x2: X(q.x), y1: Y(q.lo), y2: Y(q.hi), stroke: s.color, "stroke-width": 1.5, opacity: .7}));
      [q.lo, q.hi].forEach(v => svg.append(svgEl("line", {x1: X(q.x) - 3, x2: X(q.x) + 3, y1: Y(v), y2: Y(v), stroke: s.color, "stroke-width": 1.5, opacity: .7}))); } });
    if (p.length > 1) svg.append(svgEl("path", {d: p.map((q, i) => (i ? "L" : "M") + X(q.x) + " " + Y(q.y)).join(" "),
      fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round"}));
    p.forEach(q => svg.append(svgEl("circle", {cx: X(q.x), cy: Y(q.y), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2})));
  });
  const hair = svgEl("line", {y1: T, y2: H - B, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden"}); svg.append(hair);
  const hit = svgEl("rect", {x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent"}); svg.append(hit);
  hit.addEventListener("pointermove", e => {
    const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) / b.width * W;
    const x = xs.reduce((a, c) => Math.abs(X(c) - px) < Math.abs(X(a) - px) ? c : a, xs[0]);
    hair.setAttribute("x1", X(x)); hair.setAttribute("x2", X(x)); hair.setAttribute("visibility", "visible");
    tip(e, [el("div", {style: "color:var(--ink-2)"}, `${xLabel} ${xFmt(x)}`), ...series.map(s => { const q = s.points.find(p => p.x === x);
      return el("div", {}, el("i", {style: `display:inline-block;width:10px;height:3px;background:${s.color};margin-right:6px;vertical-align:middle`}),
        el("b", {}, q ? f3(q.y) : "–"), " ", s.name, q && q.lo != null ? ` (${f3(q.lo)}–${f3(q.hi)})` : ""); })]);
  });
  hit.addEventListener("pointerleave", () => { hair.setAttribute("visibility", "hidden"); untip(); });
  const legend = series.length > 1 ? el("div", {class: "legend"}, series.map(s => el("span", {}, el("i", {style: `background:${s.color}`}), s.name))) : "";
  return el("div", {}, legend, svg);
}
const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)"];

// ── data access ──
const CS = D.classify_summary || [], CF = D.classify_folds || [];
function summ(f) { return CS.filter(r => Object.entries(f).every(([k, v]) => v === undefined || r[k] === v)); }
function folds(f) { return CF.filter(r => Object.entries(f).every(([k, v]) => v === undefined || r[k] === v)); }
const mrRows = rows => uniq(rows.map(mr)).sort().map(k => ({key: k, label: k}));

function detail(filter, title) {
  const fs = folds(filter);
  if (!fs.length) return;
  const classes = uniq(fs.flatMap(f => f.classes));
  const pcf = classes.map(c => ({cls: c, f1: mean(fs.map(f => f.test.per_class_f1[c])), support: fs.reduce((s, f) => s + (f.test.support[c] || 0), 0)}));
  const k = fs[0].classes.length, same = fs.every(f => f.classes.join() === fs[0].classes.join());
  const parts = [el("p", {class: "sub"}, `${fs.length} fold(s). Per-class F1 = mean over folds; confusion = summed over folds (rows true, columns predicted).`)];
  parts.push(table([{key: "cls", label: "class", cls: "l"}, {key: "f1", label: "F1", fmt: f3}, {key: "support", label: "test cells"}], pcf, {name: "per_class_f1"}));
  if (same) {
    const cm = fs[0].classes.map((_, i) => fs[0].classes.map((_, j) => fs.reduce((s, f) => s + f.test.confusion_matrix[i][j], 0)));
    const rows = fs[0].classes.map(c => ({key: c, label: "true " + c})), cols = fs[0].classes.map(c => ({key: c, label: "pred " + c}));
    const idx = Object.fromEntries(fs[0].classes.map((c, i) => [c, i]));
    parts.push(el("h3", {}, "Confusion matrix (row-normalised colour, counts shown)"));
    parts.push(heatmap(rows, cols, (r, c) => { const tot = cm[idx[r]].reduce((a, b) => a + b, 0);

const state = {metric: "macro_f1_present", scheme: "within", readout: "all", model: null, set: null, task: null};
const value = (r, m) => m === "slide_mean_macro_f1_present" ? r.slide_mean_macro_f1_present : r[m];

function leaderboard(stage, scheme, title, sub) {
  const rows = summ({stage, scheme, variant: stage === "1" ? "native" : undefined, frac: null});
  const tasks = uniq(rows.map(r => r.task)).sort();
  const keys = mrRows(rows);
  const get = (rk, t) => { const r = rows.find(x => mr(x) === rk && x.task === t); return r ? {v: value(r, state.metric), ci: [r.ci_lo, r.ci_hi], n: `${r.n_folds} fold(s), ${r.n_donors} test donors`} : null; };
  const cols = tasks.map(t => ({key: t, label: taskLabel(t)}));
  const withMean = [...cols, {key: "__mean", label: "mean"}];
  const get2 = (rk, ck) => ck === "__mean" ? {v: mean(tasks.map(t => (get(rk, t) || {}).v ?? null))} : get(rk, ck);
  return el("section", {class: "card"}, el("h2", {}, title), el("p", {class: "sub"}, sub),
    heatmap(keys, withMean, get2, {name: `${scheme}_${state.metric}`, onClick: (rk, t) => t !== "__mean" &&

}

function pageStage1() {

  let rows = summ({stage: "1", variant: "native", scheme: state.scheme, frac: null});
  if (state.readout !== "all") rows = rows.filter(r => r.readout === state.readout);
  if (state.scheme !== "single_cohort") {

      heatmap(mrRows(rows), tasks.map(t => ({key: t, label: taskLabel(t)})), (rk, t) => { const r = rows.find(x => mr(x) === rk && x.task === t);
        return r ? {v: value(r, state.metric), ci: [r.ci_lo, r.ci_hi], n: `${r.n_folds} fold(s)`} : null; },
        {name: `stage1_${state.scheme}`, onClick: (rk, t) => detail({stage: "1", scheme: state.scheme, task: t, model: rk.split(" · ")[0], readout: rk.split(" · ")[1], variant: "native", frac: null}, `${rk} — ${taskLabel(t)}`)})));
  } else {

    if (!state.model || !keys.includes(state.model)) state.model = keys[0];

    if (state.model) {
      const [m, rd] = state.model.split(" · ");
      const fs = folds({stage: "1", scheme: "single_cohort", model: m, readout: rd, variant: "native", frac: null});
      const met = state.metric === "slide_mean_macro_f1_present" ? "macro_f1_present" : state.metric;
      const cell = {};
      fs.forEach(f => { const tr = f.task.replace("single:", ""); const byD = {};
        f.slides.forEach(s => { if (s[met] == null) return; ((byD[s.cohort] ||= {})[s.donor] ||= []).push(s[met]); });
        Object.entries(byD).forEach(([u, dd]) => { cell[tr + "|" + u] = mean(Object.values(dd).map(mean)); }); });
      summ({stage: "1", scheme: "within", model: m, readout: rd, variant: "native", frac: null}).forEach(r => { const c = r.task.replace("within:", ""); cell[c + "|" + c] = value(r, state.metric); });

        heatmap(cohorts.map(c => ({key: c, label: "train " + c})), cohorts.map(c => ({key: c, label: "test " + c})),
          (r, c) => cell[r + "|" + c] != null ? {v: cell[r + "|" + c]} : null, {name: `single_cohort_${m}_${rd}`,
          onClick: (r, c) => r === c ? detail({stage: "1", scheme: "within", task: "within:" + r, model: m, readout: rd, variant: "native", frac: null}, `${state.model} — within ${r}`)

}
function boxes(rows) {
  const W = 640, rowH = 26, L = 150, R = 16, H = rows.length * rowH + 30;
  const all = rows.flatMap(r => r.gene_quantiles || []); const lo = Math.min(0, ...all), hi = Math.max(...all, 0.1);
  const X = v => L + (v - lo) / (hi - lo) * (W - L - R);
  const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${Math.round(W * 1.15)}px;display:block`,
    role: "img", "aria-label": "per-gene Pearson distribution per model"});
  for (let i = 0; i <= 4; i++) { const v = lo + i * (hi - lo) / 4; svg.append(svgEl("line", {x1: X(v), x2: X(v), y1: 0, y2: H - 22, stroke: "var(--grid)"}));
    const t = svgEl("text", {x: X(v), y: H - 6, "text-anchor": "middle"}); t.textContent = v.toFixed(2); svg.append(t); }
  rows.forEach((r, i) => { const q = r.gene_quantiles; const y = i * rowH + 14;
    const t = svgEl("text", {x: L - 8, y: y + 4, "text-anchor": "end"}); t.textContent = `${r.model} · ${r.readout}`; svg.append(t);
    if (!q) return;
    svg.append(svgEl("line", {x1: X(q[0]), x2: X(q[4]), y1: y, y2: y, stroke: "var(--s1)", "stroke-width": 1.5}));
    svg.append(svgEl("rect", {x: X(q[1]), y: y - 7, width: Math.max(2, X(q[3]) - X(q[1])), height: 14, rx: 3, fill: "var(--s1)", opacity: .35}));
    svg.append(svgEl("line", {x1: X(q[2]), x2: X(q[2]), y1: y - 8, y2: y + 8, stroke: "var(--s1)", "stroke-width": 2}));
    const hitr = svgEl("rect", {x: L, y: y - rowH / 2, width: W - L - R, height: rowH, fill: "transparent"});
    hitr.addEventListener("pointermove", e => tip(e, [el("div", {}, el("b", {}, f3(q[2])), " median r, ", r.model, " · ", r.readout),
      el("div", {}, `IQR ${f3(q[1])}–${f3(q[3])}, 5–95% ${f3(q[0])}–${f3(q[4])}`)])); hitr.addEventListener("pointerleave", untip); svg.append(hitr); });
  return svg;
}

function pageStage3() {
  const out = [el("div", {class: "banner"}, "Model and readout were selected on test scores at Gate 1."), el("div", {class: "filters"}, metricFilter(render))];

    const series = combos.slice(0, 3).map((p, i) => { const fr = uniq(rs.filter(r => r.probe === p).map(r => r.frac)).sort((a, b) => a - b);
      return {name: p === "mlp" ? "2-layer MLP" : "linear", color: COLORS[i], points: fr.map(f => { const v = rs.filter(r => r.probe === p && r.frac === f).map(r => value(r, state.metric));
        const m = mean(v), s = std(v); return {x: f, y: m, lo: m - s, hi: m + s, n: v.length}; })}; });
    return el("section", {class: "card"}, el("h2", {}, taskLabel(t) + (t.startsWith("cross") ? " (cross-cohort)" : " (within-cohort)") +

}
document.getElementById("meta").textContent = `generated ${M.generated || "?"} · commit ${(M.git_commit || "?").slice(0, 8)}${M.git_dirty ? " (dirty)" : ""}${M.smoke ? " · SMOKE RUN" : ""}`;
addEventListener("hashchange", render);
render();
</script>
