# Top-level config for the DeepCell (DeepSpot) embedding evaluation pipeline.
# Run via launcher.py (submits one SLURM job per split) or
# directly via experiment.py for a single split.
#
# Mirrors the structure of configs/train.yaml (the classifier pipeline); see that file's comments
# for the shared blocks (splits, data.base_dir/model_name/correction_name, mlflow, slurm).

defaults:
  - _self_

# ── Output ─────────────────────────────────────────────────────────────────
# Folder (relative to repo root) where experiment.py writes per-split results.
output_dir: outputs_deepspot

# ── WSI splits ─────────────────────────────────────────────────────────────
# Each entry defines one Leave-One-WSI-Out (LWO) fold. Values are the fraction of cells to keep
# from that WSI (1.0 = all cells). Reuses the exact same shape as configs/train.yaml so `splits`
# can be shared/copied between the classifier and DeepCell pipelines; any `cell_type_proportions`
# sub-block (classifier-specific, per-cell-type subsampling) is ignored here.
splits:
  - train:
      Xenium_V1_Human_Lung_Cancer_Addon_FFPE: 1.0
      Xenium_V1_Human_Colon_Cancer_P2_CRC_Add_on_FFPE: 1.0
      Xenium_V1_Human_Colorectal_Cancer_Addon_FFPE: 1.0
      Xenium_V1_Human_Ovarian_Cancer_Addon_FFPE: 1.0
      Xenium_V1_hLiver_cancer_section_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    test:
      Xenium_V1_humanLung_Cancer_FFPE: 1.0

  - train:
      Xenium_V1_humanLung_Cancer_FFPE: 1.0
      Xenium_V1_Human_Lung_Cancer_Addon_FFPE: 1.0
      Xenium_V1_Human_Colorectal_Cancer_Addon_FFPE: 1.0
      Xenium_V1_Human_Ovarian_Cancer_Addon_FFPE: 1.0
      Xenium_V1_hLiver_cancer_section_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    test:
      Xenium_V1_Human_Colon_Cancer_P2_CRC_Add_on_FFPE: 1.0

  - train:
      Xenium_V1_humanLung_Cancer_FFPE: 1.0
      Xenium_V1_Human_Lung_Cancer_Addon_FFPE: 1.0
      Xenium_V1_Human_Colon_Cancer_P2_CRC_Add_on_FFPE: 1.0
      Xenium_V1_Human_Colorectal_Cancer_Addon_FFPE: 1.0
      Xenium_V1_Human_Ovarian_Cancer_Addon_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    test:
      Xenium_V1_hLiver_cancer_section_FFPE: 1.0

  - train:
      Xenium_V1_humanLung_Cancer_FFPE: 1.0
      Xenium_V1_Human_Lung_Cancer_Addon_FFPE: 1.0
      Xenium_V1_Human_Colon_Cancer_P2_CRC_Add_on_FFPE: 1.0
      Xenium_V1_Human_Colorectal_Cancer_Addon_FFPE: 1.0
      Xenium_V1_Human_Ovarian_Cancer_Addon_FFPE: 1.0
      Xenium_V1_hLiver_cancer_section_FFPE: 1.0
    test:
      Xenium_Prime_Human_Skin_FFPE: 1.0

# When true, the launcher also submits a same-WSI 80/20 split job (upper-bound mode; the cell-level
# 80/20 split is WSI-of-origin-agnostic — see deepspot_training/experiment.py::_resolve_split).
same_wsi_split: False

# ── Data paths & fixed data-shaping parameters ──────────────────────────────
# num_genes / n_neighbors are FIXED per experiment run (not swept in `hparams`), because changing
# either requires touching the loaded dataset; sweeping them would mean re-reading adata/embeddings
# from disk per grid trial. Run one experiment per (num_genes, n_neighbors) combination you want to
# compare — each gets its own output_dir leaf (see below).
data:
  # base_dir / adata_path_template resolve from the DATASETS_ROOT / XENIUM_PROCESSED_OUTPUT_ROOT
  # env vars (see src/python/code_configs/paths.py and .env.example) -- set them before running.
  base_dir: ${oc.env:DATASETS_ROOT}
  # Template for the per-sample Xenium AnnData, with a {sample} placeholder.
  adata_path_template: ${oc.env:XENIUM_PROCESSED_OUTPUT_ROOT}/{sample}/adata.h5ad
  model_name: ???          # e.g. virchow_v2, UNI2, CellViT_SAM
  correction_name: ???     # e.g. Base, rpca, scanorama
  # Leave empty to average all embedding keys found in the h5 file.
  embeddings_datasets: []
  # If true (default), filter to only cells matched between CellViT and Xenium
  # (requires a 'matching' dataset in the embeddings H5 file).
  consider_matching: False
  # log1p normalization target sum for gene counts (ignored if raw_counts: true).
  target_sum: 10000
  raw_counts: False
  # The model is trained ONCE, on the `num_genes` most highly variable genes (one HVG call, with
  # rank info). `gene_interval` is purely a post-hoc reporting slice: for each n here, mean/median
  # Pearson is re-aggregated over just the n most variable genes *within that trained set* (by
  # highly_variable_rank) — no retraining, no further HVG computation. Values > num_genes are
  # clipped to num_genes. See deepspot_training/experiment.py::_gene_interval_stats.
  gene_interval: [10,20,30,40,50]
  num_genes: 50
  # Directory of precomputed per-split HVG rankings (see compute_hvgs.py / scripts/compute_hvgs.sh —
  # run that once, on a big-memory node, before training). experiment.py loads
  # {hvg_dir}/{split_label}.csv and selects the top num_genes genes from it instead of computing
  # HVGs on the fly. Set to null to fall back to on-the-fly computation in load_data (only advisable
  # on a large-memory node — see custom_dataloader.py's memory notes).
  hvg_dir: data/HVGsSplit
  hvg_flavor: seurat_v3_paper
  hvg_batch_key: sampleID
  # compute_hvgs.py only keeps rank info for the top hvg_max_genes genes (num_genes/gene_interval
  # never need more than this).
  hvg_max_genes: 500
  n_neighbors: 30
  # 0 = no spatial upsampling/smoothing (see deepspot.utils.utils_dataloader.spatial_upsample_and_smooth).
  resolution: 0
  # 'cell' or 'cell_neighbors' (DeepSpot's DeepCell cell-context modes).
  cell_context: cell_neighbors

# ── MLflow ─────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: file:./mlruns
  experiment_name: deepcell_embeddings_eval

# ── Training ───────────────────────────────────────────────────────────────
training:
  num_epochs: 6
  batch_size: 1024
  early_stopping_patience: 3
  early_stopping_min_delta: 0.01

# ── Hyperparameter search space ────────────────────────────────────────────
# Set tune: false and provide a single-element values list to fix a hparam.
# These are pure model/training knobs — none of them require reloading the dataset (see data: above).
hparams:
  learning_rate:
    tune: True
    values: [1.0e-4, 1.0e-3]
  dropout:
    tune: False
    values: [0.2]
  weight_decay:
    tune: False
    values: [1.0e-6]
  loss_func:
    tune: False
    values: ["mse"]
  gene_normalization:
    tune: True
    values: [null, "standard"]
  n_ensemble:
    tune: False
    values: [10]
  phi2rho_size:
    tune: False
    values: [1024]
  emb_size:
    tune: False
    values: [1024]
  agg_neighbors:
    tune: False
    values: ["max"]

# ── SLURM ──────────────────────────────────────────────────────────────────
slurm:
  partition: gpu
  gres: gpu:1
  mem: 256G
  time: "05:00:00" # overwritten by launcher.py based on the grid size
  cpus_per_task: 16
  conda_env: cellViT
  output_dir: slurm_logs_deepspot
  # If true, run all splits sequentially in a single SLURM job on one GPU
  # instead of submitting one job per split.
  sequential: false

# ── Launcher flags ─────────────────────────────────────────────────────────
dry_run: False       # Print SLURM scripts without submitting
debug_split: null    # If set to an int, print logs of that split and exit

# ── Set by launcher per SLURM job; do not set in this file ─────────────────
split_idx: null

# ── Hydra settings ─────────────────────────────────────────────────────────
hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
