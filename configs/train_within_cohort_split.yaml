# When true, the launcher also submits a same-WSI 70/15/15 train/val/test
# split job (upper bound), pooled across all WSIs (see split_idx == -1
# handling in experiment.py).
same_wsi_split: false

# ── Patch-grid spatial split ────────────────────────────────────────────────
# Set enabled: true to use grid_experiment.py instead of experiment.py.
# Cells are restricted to a 1/4 checkerboard of spatial patches so train and
# test patches are never adjacent (prevents embedding-window leakage).
# All 4 checkerboard offsets are evaluated in a single SLURM job.
#
# List the WSIs to include under `wsis` (name → fraction of cells to keep).
# A single WSI gives a within-WSI spatial split; multiple WSIs give an
# across-WSI split — the code is identical either way.
#
# patch_size: grid cell size in the same pixel units as x_centroid/y_centroid.
#             Should be >= the foundation model's receptive field.
patch_split:
  enabled: False
  patch_size: 224
  wsis:              # map WSI name → fraction of cells to keep (1.0 = all)
    { Xenium_V1_humanLung_Cancer_FFPE: 1.0,
      Xenium_V1_Human_Lung_Cancer_Addon_FFPE: 1.0,
      Xenium_V1_Human_Colon_Cancer_P2_CRC_Add_on_FFPE: 1.0,
      Xenium_V1_Human_Colorectal_Cancer_Addon_FFPE: 1.0,
      Xenium_V1_Human_Ovarian_Cancer_Addon_FFPE: 1.0,
      Xenium_V1_hLiver_cancer_section_FFPE: 1.0,
      Xenium_Prime_Human_Skin_FFPE: 1.0}               # e.g. Xenium_V1_humanLung_Cancer_FFPE: 1.0

# ── Output ─────────────────────────────────────────────────────────────────
# Folder (relative to repo root) where experiment.py writes per-split results:
# results_summary.yaml (pooled + slide-mean val/test metrics, confusion matrices),
# per_slide_metrics.csv (every metric for each val and test slide),
# per_slide_confusion_matrices.yaml, grid_search_results.csv, config_resolved.yaml.
output_dir: outputs_classifier/

# ── Saved weights ──────────────────────────────────────────────────────────
# The best (val-selected) classifier of each split is saved to
#   {root}/{experiment}/{train_cohorts}/{job_name}/{model.pt,model_info.yaml}
# job_name = {model}__{correction}__{mapping}__{matching}__{embeddings}__{split}.
# Reload with src.python.classifier_training.saved_models.load_classifier.
save_model:
  enabled: true
  root: saved_models/classification_linear

# ── Data paths ─────────────────────────────────────────────────────────────
# base_dir resolves from the DATASETS_ROOT env var (see src/python/code_configs/paths.py
# and .env.example) -- set it before running, e.g. `export DATASETS_ROOT=/path/to/datasets`.
data:
  base_dir: ${oc.env:DATASETS_ROOT}
  model_name: ???          # e.g. virchow_v2, UNI2, CellViT_SAM
  correction_name: ???     # e.g. Base, rpca, scanorama
  # Leave empty to average all embedding keys found in the h5 file.
  embeddings_datasets: [bottom_left, bottom_right, top_left, top_right]
  # If true (default), filter to only cells matched between CellViT and Xenium
  # (requires a 'matching' dataset in the embeddings H5 file). If false, train
  # on all detected cells, including non-matching ones.
  consider_matching: false
  # Keep at most this many cells per WSI: a seeded random subset of its typed cells,
  # drawn while reading, so memory scales with the cap (WSI proportions then apply
  # on top). null = every cell.
  max_cells_per_wsi: null

# ── MLflow ─────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: file:./mlruns
  experiment_name: embeddings_eval_within_cohort_SPLIT

# ── Training ───────────────────────────────────────────────────────────────
training:
  num_epochs: 30
  batch_size: 256
  # Early stopping on the val selection score (below): stop once it hasn't improved
  # by more than min_delta for `patience` epochs and keep the best epoch's weights --
  # num_epochs is then the maximum. patience: null = train all num_epochs, keep the last.
  early_stopping:
    patience: 5
    min_delta: 0.0
  # Val score picking both the best epoch (early stopping) and the best trial:
  #   pooled_macro_f1                -- macro F1 over all val cells pooled (old behaviour)
  #   slide_macro_f1                 -- mean over val slides of each slide's macro F1
  #   cohort_balanced_slide_macro_f1 -- mean over cohorts of their val slides' mean macro F1
  #                                     (every val slide must match a pattern in `cohorts`)
  # A slide's macro F1 averages the classes present in that slide.
  selection_metric: slide_macro_f1
  # If true, experiment.py writes {output_dir}/test_predictions.csv for the
  # best (val-selected) trial of each split: one row per test cell with
  # cell_id, wsi, true_label, predicted_label, per-class prob_<class> and
  # correct. No effect on grid_experiment.py (it doesn't track cell_id).
  save_test_predictions: false

# ── Hyperparameter search space ────────────────────────────────────────────
# Set tune: false and provide a single-element values list to fix a hparam.
hparams:
  learning_rate:
    tune: false
    values: [5.0e-4]
  dropout:
    tune: true
    values: [0.2]
  hidden_dim:
    tune: False
    values: [0,32]   # 0 = logistic regression
  pca_components:
    tune: False
    values: [null, 50]     # null = no PCA
  normalization:
    tune: False
    values: ["none", "z_score"]
  loss_weights:
    tune: true
    # "by_*" reweight the CE loss; "oversampling_*" instead draw train batches with a
    # WeightedRandomSampler using the same balanced weights, leaving the loss unweighted.
    values: ["none", "by_wsi", "by_cell_type"] 

# ── SLURM ──────────────────────────────────────────────────────────────────
slurm:
  partition: gpu
  gres: gpu:1
  mem: 256G
  # Wall time. auto_time: true estimates each job's --time from the cells in its
  # split (embeddings h5 headers -- needs DATASETS_ROOT where the launcher runs):
  #   overhead + safety * (load + trials * (num_epochs * (train + val) + test) * s_per_cell_epoch)
  # see launcher.py's _estimate_minutes. auto_time: false requests `time` as given.
  auto_time: true
  time: "24:00:00"
  time_estimate:
    # Per (train + val) cell per epoch, incl. the val pass. Default derived from the old
    # 2 min/epoch on ~0.8M-cell splits; replace with the median `timing.seconds_per_cell_epoch`
    # of finished runs' results_summary.yaml (the launcher prints it when available).
    seconds_per_cell_epoch: 1.5e-4
    load_seconds_per_cell_dataset: 3.0e-5   # reading one embeddings_* dataset, per cell
    overhead_minutes: 15
    safety_factor: 1.5
    max_time: "120:00:00"                   # your partition's wall-time limit
  cpus_per_task: 32
  conda_env: cellViT
  output_dir: slurm_logs
  # If true, run all splits sequentially in a single SLURM job on one GPU
  # instead of submitting one job per split.
  sequential: false

# ── Launcher flags ─────────────────────────────────────────────────────────
dry_run: false       # Print SLURM scripts without submitting
debug_split: null    # If set to an int, print logs of that split and exit

# ── Set by launcher per SLURM job; do not set in this file ─────────────────
split_idx: null

# ── Hydra settings ─────────────────────────────────────────────────────────
hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
