# Within-cohort (SPLIT) leave-one-donor-out classifier evaluation -- generated by
# scripts/make_within_cohort_configs.py from configs/train_cross_cohort.yaml.
# Run via launcher.py (submits one SLURM job per split) or
# directly via experiment.py for a single split.

defaults:
  - _self_

# ── Reproducibility ────────────────────────────────────────────────────────
# Single seed driving every source of randomness in the pipeline: WSI/cell-type
# subsampling (experiment.py/grid_experiment.py data loading), the same_wsi_split
# random permutation, PCA's randomized SVD solver, and model init/DataLoader
# shuffling/dropout inside trainer.py. The same seed is reused for every grid
# trial within a split -- this is intentional, so trials only differ by their
# hyperparameters, not by init/shuffling noise. Re-running with the same
# config_name and seed reproduces identical results.
seed: 42

# ── Mapping ────────────────────────────────────────────────────────────────
# Must match a key in src/python/code_configs/mappings.py
mapping: simplified_broad

# ── Experiment ─────────────────────────────────────────────────────────────
# Name of the experiment family this config belongs to (e.g. cross_cohort,
# within_cohort, across_resolution). When set, results go to
# {output_dir}/{experiment}/{model}/... (so configs sharing output_dir can't
# overwrite -- or, via the launcher's skip-check, skip -- each other's split_<i>),
# and saved weights to {save_model.root}/{experiment}/... (see save_model below).
# null keeps the old results layout; saved weights then use this config's name.
experiment: within_cohort_SPLIT

# ── Cohorts ────────────────────────────────────────────────────────────────
# cohort -> list of WSI names or fnmatch patterns; a WSI gets the first cohort (in
# this order) with a matching pattern. Used by training.selection_metric:
# cohort_balanced_slide_macro_f1, the `cohort` column of per_slide_metrics.csv and,
# for splits without `train_cohorts`, the saved-weights folder name. Patterns for
# the sources of _metadata_work/make_splits.py (on-disk WSI names):
#   cohorts:
#     NM: ["GSM9509*"]
#     VANNAN: ["GSM7990*"]
#     MCCORD: ["GSM9054*"]
#     JOHNSON: ["fetal_*", "tHIO_*"]
#     10X: ["Xenium*"]
cohorts:
  SPLIT: ["GSM9509*"]              # breast + lung cancer (SPLIT, Nature Methods)

# ── WSI splits ─────────────────────────────────────────────────────────────
# Each entry defines one Leave-One-WSI-Out (LWO) fold with train/val/test.
# Values are the fraction of cells to keep from that WSI (1.0 = all cells).
# Optionally add cell_type_proportions under train, val, or test to further
# subsample by cell type (after mapping). Omitted cell types default to 1.0
# (keep all). Example:
#   - train:
#       SomeWSI: 1.0
#       cell_type_proportions:
#         SomeWSI:
#           Malignant: 0.8
#           Lymphoid: 0.5
#     val:
#       AnotherWSI: 1.0
#     test:
#       OtherWSI: 1.0
#
# Optionally give a split `train_cohorts: [COHORT_A, COHORT_B]` (next to
# train/val/test) -- it names the saved-weights folder (sorted, '+'-joined,
# e.g. JOHNSON+MCCORD+NM+VANNAN). Without it the train WSIs' cohorts (see
# `cohorts`) are used, and without a `cohorts` map the folder is split_<i>.
#
# Scheme: within-cohort leave-one-donor-out over SPLIT -- regenerate with
# scripts/make_within_cohort_configs.py. Fold i: test = every slide of one donor;
# val = B16, L7 (the cohort's val slides in
# configs/train_cross_cohort.yaml, fixed across folds); train = the cohort's other
# slides. A donor's slides are never split across train/val/test.
