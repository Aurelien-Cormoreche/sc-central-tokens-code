# Leave-one-patient-out gene-expression prediction (deepspot_training) on
# every human Xenium Prime 5K slide (SPLIT NSCLC + 10x lymph node, prostate, skin) -- generated by
# scripts/make_deepspot_lopo_configs.py from configs/deepspot_train_colon.yaml; edit there.
# Fold i: test = every slide of one patient; val = the next patient (early stopping; never in
# train); train = the rest. Hyperparameters are fixed, as in the template.
# Before the experiments, precompute the per-fold HVGs (data.hvg_dir):
#   sbatch scripts/compute_hvgs.sh --config-name=deepspot_lopo_prime

defaults:
  - _self_

# ── Output ─────────────────────────────────────────────────────────────────
# Folder (relative to repo root) where experiment.py writes per-split results.
output_dir: outputs_deepspot_lopo_prime

# ── WSI splits ─────────────────────────────────────────────────────────────
# Leave-one-patient-out over 9 slides of 9 patients (splits.csv donor_key);
# val = the next patient in donor_key order (cyclic); regenerate with
# scripts/make_deepspot_lopo_configs.py. Left out (no embeddings):
# none.
splits:
  # split 0: test = 10X::Avaden Biosciences (Lymph Node, Left Axilla; Reactive Lymph Node) (1 slide); val = 10X::Discovery Life Sciences (Prostate Cancer, Adenocarcinoma) (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509134_NSCLC_5k_L1_L1: 1.0
      GSM9509135_NSCLC_5k_L3_L3: 1.0
      GSM9509136_NSCLC_5k_L5_L5: 1.0
      GSM9509137_NSCLC_5k_L6_L6: 1.0
      GSM9509138_NSCLC_5k_L7_L7: 1.0
      GSM9509139_NSCLC_5k_L8_L8: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    val:
      Xenium_Prime_Human_Prostate_FFPE: 1.0
    test:
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0

  # split 1: test = 10X::Discovery Life Sciences (Prostate Cancer, Adenocarcinoma) (1 slide); val = 10X::Discovery Life Sciences (Skin - Right Lower Extremity, Melanoma) (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509134_NSCLC_5k_L1_L1: 1.0
      GSM9509135_NSCLC_5k_L3_L3: 1.0
      GSM9509136_NSCLC_5k_L5_L5: 1.0
      GSM9509137_NSCLC_5k_L6_L6: 1.0
      GSM9509138_NSCLC_5k_L7_L7: 1.0
      GSM9509139_NSCLC_5k_L8_L8: 1.0
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0
    val:
      Xenium_Prime_Human_Skin_FFPE: 1.0
    test:
      Xenium_Prime_Human_Prostate_FFPE: 1.0

  # split 2: test = 10X::Discovery Life Sciences (Skin - Right Lower Extremity, Melanoma) (1 slide); val = NM::L1 (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509135_NSCLC_5k_L3_L3: 1.0
      GSM9509136_NSCLC_5k_L5_L5: 1.0
      GSM9509137_NSCLC_5k_L6_L6: 1.0
      GSM9509138_NSCLC_5k_L7_L7: 1.0
      GSM9509139_NSCLC_5k_L8_L8: 1.0
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0
      Xenium_Prime_Human_Prostate_FFPE: 1.0
    val:
      GSM9509134_NSCLC_5k_L1_L1: 1.0
    test:
      Xenium_Prime_Human_Skin_FFPE: 1.0

  # split 3: test = NM::L1 (1 slide); val = NM::L3 (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509136_NSCLC_5k_L5_L5: 1.0
      GSM9509137_NSCLC_5k_L6_L6: 1.0
      GSM9509138_NSCLC_5k_L7_L7: 1.0
      GSM9509139_NSCLC_5k_L8_L8: 1.0
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0
      Xenium_Prime_Human_Prostate_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    val:
      GSM9509135_NSCLC_5k_L3_L3: 1.0
    test:
      GSM9509134_NSCLC_5k_L1_L1: 1.0

  # split 4: test = NM::L3 (1 slide); val = NM::L5 (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509134_NSCLC_5k_L1_L1: 1.0
      GSM9509137_NSCLC_5k_L6_L6: 1.0
      GSM9509138_NSCLC_5k_L7_L7: 1.0
      GSM9509139_NSCLC_5k_L8_L8: 1.0
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0
      Xenium_Prime_Human_Prostate_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    val:
      GSM9509136_NSCLC_5k_L5_L5: 1.0
    test:
      GSM9509135_NSCLC_5k_L3_L3: 1.0

  # split 5: test = NM::L5 (1 slide); val = NM::L6 (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509134_NSCLC_5k_L1_L1: 1.0
      GSM9509135_NSCLC_5k_L3_L3: 1.0
      GSM9509138_NSCLC_5k_L7_L7: 1.0
      GSM9509139_NSCLC_5k_L8_L8: 1.0
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0
      Xenium_Prime_Human_Prostate_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    val:
      GSM9509137_NSCLC_5k_L6_L6: 1.0
    test:
      GSM9509136_NSCLC_5k_L5_L5: 1.0

  # split 6: test = NM::L6 (1 slide); val = NM::L7 (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509134_NSCLC_5k_L1_L1: 1.0
      GSM9509135_NSCLC_5k_L3_L3: 1.0
      GSM9509136_NSCLC_5k_L5_L5: 1.0
      GSM9509139_NSCLC_5k_L8_L8: 1.0
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0
      Xenium_Prime_Human_Prostate_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    val:
      GSM9509138_NSCLC_5k_L7_L7: 1.0
    test:
      GSM9509137_NSCLC_5k_L6_L6: 1.0

  # split 7: test = NM::L7 (1 slide); val = NM::L8 (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509134_NSCLC_5k_L1_L1: 1.0
      GSM9509135_NSCLC_5k_L3_L3: 1.0
      GSM9509136_NSCLC_5k_L5_L5: 1.0
      GSM9509137_NSCLC_5k_L6_L6: 1.0
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0
      Xenium_Prime_Human_Prostate_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    val:
      GSM9509139_NSCLC_5k_L8_L8: 1.0
    test:
      GSM9509138_NSCLC_5k_L7_L7: 1.0

  # split 8: test = NM::L8 (1 slide); val = 10X::Avaden Biosciences (Lymph Node, Left Axilla; Reactive Lymph Node) (1 slide); train = 7 slides of 7 patients
  - train:
      GSM9509134_NSCLC_5k_L1_L1: 1.0
      GSM9509135_NSCLC_5k_L3_L3: 1.0
      GSM9509136_NSCLC_5k_L5_L5: 1.0
      GSM9509137_NSCLC_5k_L6_L6: 1.0
      GSM9509138_NSCLC_5k_L7_L7: 1.0
      Xenium_Prime_Human_Prostate_FFPE: 1.0
      Xenium_Prime_Human_Skin_FFPE: 1.0
    val:
      Xenium_Prime_Human_Lymph_Node_Reactive_FFPE: 1.0
    test:
      GSM9509139_NSCLC_5k_L8_L8: 1.0


# No same-WSI (cell-level 80/20) upper-bound mode requested for this LWO sweep.
same_wsi_split: False

# ── Data paths & fixed data-shaping parameters ──────────────────────────────
data:
  # base_dir / adata_path_template resolve from the DATASETS_ROOT / XENIUM_PROCESSED_OUTPUT_ROOT
  # env vars (see src/python/code_configs/paths.py and .env.example) -- set them before running.
  base_dir: ${oc.env:DATASETS_ROOT}
  adata_path_template: ${oc.env:XENIUM_PROCESSED_OUTPUT_ROOT}/{sample}/adata.h5ad
  model_name: ???          # e.g. virchow_v2, UNI2, CellViT_SAM
  correction_name: ???     # e.g. Base, rpca, scanorama
  embeddings_datasets: [bottom_left, bottom_right, top_left, top_right]
  consider_matching: False
  target_sum: 10000
  raw_counts: False
  gene_interval: [50,100,200,300]
  num_genes: 300
  hvg_dir: data/HVGsSplitLOPO_prime
  hvg_flavor: seurat_v3_paper
  hvg_batch_key: sampleID
  hvg_max_genes: 500   # > num_genes: ranked genes absent from a test slide get replaced
  n_neighbors: 0
  resolution: 0
  cell_context: cell

# ── MLflow ─────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: file:./mlruns
  experiment_name: deepcell_embeddings_eval_lopo_prime

# ── Training ───────────────────────────────────────────────────────────────
training:
  num_epochs: 6
  batch_size: 1024
  early_stopping_patience: 3
  early_stopping_min_delta: 0.01

# ── Hyperparameter search space ────────────────────────────────────────────
# Fixed to a single (gene_normalization=standard, learning_rate=1.0e-3) combination -- no grid
# search/tuning (tune: False everywhere), unlike configs/deepspot_train.yaml which sweeps both.
hparams:
  learning_rate:
    tune: False
    values: [1.0e-3]
  dropout:
    tune: False
    values: [0.2]
  weight_decay:
    tune: False
    values: [1.0e-6]
  loss_func:
    tune: False
    values: ["mse"]
  gene_normalization:
    tune: False
    values: ["standard"]
  n_ensemble:
    tune: False
    values: [10]
  phi2rho_size:
    tune: False
    values: [1024]
  emb_size:
    tune: False
    values: [1024]
  agg_neighbors:
    tune: False
    values: ["max"]

# ── SLURM ──────────────────────────────────────────────────────────────────
slurm:
  partition: gpu
  gres: gpu:1
  mem: 128G
  time: "05:00:00" # overwritten by launcher.py based on the grid size
  cpus_per_task: 16
  conda_env: cellViT
  output_dir: slurm_logs_deepspot_lopo_prime
  # If true, run all splits sequentially in a single SLURM job on one GPU
  # instead of submitting one job per split.
  sequential: false

# ── Launcher flags ─────────────────────────────────────────────────────────
dry_run: False       # Print SLURM scripts without submitting
debug_split: null    # If set to an int, print logs of that split and exit

# ── Set by launcher per SLURM job; do not set in this file ─────────────────
split_idx: null

# ── Hydra settings ─────────────────────────────────────────────────────────
hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
