# No same-WSI (cell-level 80/20) upper-bound mode requested for this LWO sweep.
same_wsi_split: False

# ── Data paths & fixed data-shaping parameters ──────────────────────────────
data:
  # base_dir / adata_path_template resolve from the DATASETS_ROOT / XENIUM_PROCESSED_OUTPUT_ROOT
  # env vars (see src/python/code_configs/paths.py and .env.example) -- set them before running.
  base_dir: ${oc.env:DATASETS_ROOT}
  # Same template as configs/deepspot_train.yaml — {sample} resolves to each GSM id below.
  adata_path_template: ${oc.env:XENIUM_PROCESSED_OUTPUT_ROOT}/{sample}/adata.h5ad
  model_name: ???          # e.g. UNI2_100_resized (see note at top of file)
  correction_name: ???     # folder the GSM embeddings h5 files live under (see note at top of file)
  embeddings_datasets: [bottom_left, bottom_right, top_left, top_right]
  consider_matching: False
  target_sum: 10000
  raw_counts: False
  gene_interval: [50,100,200,300]
  num_genes: 300
  hvg_dir: data/HVGsSplitGSM
  hvg_flavor: seurat_v3_paper
  hvg_batch_key: sampleID
  hvg_max_genes: 500
  n_neighbors: 30
  resolution: 0
  cell_context: cell_neighbors

# ── MLflow ─────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: file:./mlruns
  experiment_name: deepcell_embeddings_eval_gsm

# ── Training ───────────────────────────────────────────────────────────────
training:
  num_epochs: 6
  batch_size: 1024
  early_stopping_patience: 3
  early_stopping_min_delta: 0.01

# ── Hyperparameter search space ────────────────────────────────────────────
hparams:
  learning_rate:
    tune: True
    values: [1.0e-4, 1.0e-3]
  dropout:
    tune: False
    values: [0.2]
  weight_decay:
    tune: False
    values: [1.0e-6]
  loss_func:
    tune: False
    values: ["mse"]
  gene_normalization:
    tune: True
    values: [null, "standard"]
  n_ensemble:
    tune: False
    values: [10]
  phi2rho_size:
    tune: False
    values: [1024]
  emb_size:
    tune: False
    values: [1024]
  agg_neighbors:
    tune: False
    values: ["max"]

# ── SLURM ──────────────────────────────────────────────────────────────────
slurm:
  partition: gpu
  gres: gpu:1
  mem: 256G
  time: "05:00:00" # overwritten by launcher.py based on the grid size
  cpus_per_task: 16
  conda_env: cellViT
  output_dir: slurm_logs_deepspot_gsm
  # If true, run all 15 folds sequentially in a single SLURM job on one GPU
  # instead of submitting one job per split.
  sequential: False

# ── Launcher flags ─────────────────────────────────────────────────────────
dry_run: False       # Print SLURM scripts without submitting
debug_split: null    # If set to an int, print logs of that split and exit

# ── Set by launcher per SLURM job; do not set in this file ─────────────────
split_idx: null

# ── Hydra settings ─────────────────────────────────────────────────────────
hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
