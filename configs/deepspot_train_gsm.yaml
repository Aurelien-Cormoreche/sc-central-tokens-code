# Top-level config for the DeepCell (DeepSpot) embedding evaluation pipeline, restricted to the
# 15 GSM-accession samples (GSM7990532 ... GSM7990559, see src/python/extract_embeddings/
# extract_embeddings.py::GSM_SAMPLE_IDS) with full Leave-One-Out splits: each of the 15 folds
# below trains on the other 14 samples and tests on the one held out.
#
# Otherwise identical to configs/deepspot_train.yaml — see that file's comments for the shared
# blocks. Two things you must set per run, same as before:
#   - data.model_name / data.correction_name: point at wherever the GSM embeddings actually live.
#     They currently sit at $DATASETS_ROOT/UNI2_100_resized_h5/{gsm_id}/embeddings_dataset.h5 with
#     no correction_name subfolder and no correction step ever run on them, whereas experiment.py
#     always looks under {base_dir}/{model_name}_h5/{correction_name}/{wsi}/... — so pass
#     model_name=UNI2_100_resized and whatever correction_name folder you place/symlink the GSM
#     h5 files under before running.
#   - data.hvg_dir: precomputed HVG rankings must exist per split_label (split_0.csv ...
#     split_14.csv) under this directory, or set it to null to compute HVGs on the fly. Run
#     compute_hvgs.py against this config first.

defaults:
  - _self_

# ── Output ─────────────────────────────────────────────────────────────────
# Folder (relative to repo root) where experiment.py writes per-split results.
output_dir: outputs_deepspot_gsm

