<html lang="en">

<!-- Template for scripts/make_results_report.py, which replaces the two placeholders. -->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
  --sel: rgba(42,120,214,0.10); --accent: #2a78d6; --hatch: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --pos: 42,120,214; --neg: 227,73,72;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --sel: rgba(57,135,229,0.18); --accent: #3987e5; --hatch: #4a4a46;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --pos: 57,135,229; --neg: 230,103,103;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
  --sel: rgba(57,135,229,0.18); --accent: #3987e5; --hatch: #4a4a46;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --pos: 57,135,229; --neg: 230,103,103;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
.wrap { max-width: 1520px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
h3 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
p { margin: 0; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.section { margin-top: 16px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
button, select, input { font: inherit; color: inherit; }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.btn:hover { background: var(--hover); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Filter row */
.controls { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 10px 0; margin-top: 12px; background: var(--page); border-bottom: 1px solid var(--border); }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > label, .ctl > .lbl { color: var(--ink-2); font-size: 12px; }
.ctl select, .ctl input[type=search] { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
.ctl input[type=search] { width: 220px; max-width: 60vw; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }

.spacer { flex: 1; }
.chk { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 4px 0 14px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.tile .label { font-size: 12px; color: var(--ink-2); }
.tile .value { font-size: 26px; font-weight: 600; line-height: 1.2; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile .runrow { display: flex; align-items: baseline; gap: 6px; font-size: 13px; }
.tile .runrow b { font-size: 18px; font-weight: 600; }

/* Legends & keys */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.key { display: inline-flex; align-items: center; gap: 5px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.linekey { display: inline-block; width: 14px; height: 2px; border-radius: 1px; flex: none; }

/* Main layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 16px; margin-top: 16px; align-items: start; }
@media (max-width: 1180px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.detail { position: sticky; top: 62px; max-height: calc(100vh - 76px); overflow: auto; }
@media (max-width: 1180px) { .detail { position: static; max-height: none; } }

/* Slide table */
.table-wrap { overflow: auto; max-height: calc(100vh - 140px); border-top: 1px solid var(--border); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
thead th { position: sticky; background: var(--surface); z-index: 2; font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: left; white-space: nowrap; }
thead tr:first-child th { top: 0; }
thead tr:nth-child(2) th { top: 27px; }
thead th.num { text-align: right; }
thead th button { all: unset; cursor: pointer; display: inline-flex; gap: 3px; align-items: center; }
thead th button:focus-visible { outline: 2px solid var(--accent); }
thead th .arrow { color: var(--ink); font-size: 10px; }
tr.grp th { position: sticky; top: 54px; z-index: 1; background: var(--page); text-align: left; font-size: 12px; font-weight: 600; padding: 7px 8px; color: var(--ink); }
tr.grp th .muted { font-weight: 400; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: var(--hover); }
tbody tr.row.sel { background: var(--sel); }
tbody tr.row.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
#tbl th, #tbl td { padding-left: 6px; padding-right: 6px; }
td.name { min-width: 200px; max-width: 300px; }
td.name .sub { font-size: 11.5px; color: var(--muted); }
td.heat { width: 54px; min-width: 54px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; padding: 0; border-bottom: 2px solid var(--surface); border-right: 2px solid var(--surface); }
td.heat > div { padding: 6px 2px; }
.absent { background: repeating-linear-gradient(45deg, transparent 0 4px, var(--hatch) 4px 5px); color: var(--muted); }
td.metric { min-width: 150px; width: 22%; }
.mbar { display: flex; align-items: center; gap: 8px; }
.track { position: relative; flex: 1; height: 12px; border-left: 1px solid var(--axis); }
.track .bar { position: absolute; left: 0; top: 1px; height: 10px; border-radius: 0 4px 4px 0; }
.track .pt { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
.track .span { position: absolute; top: 50%; height: 1px; background: var(--axis); }
.mvals { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.mvals div { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
td.delta div { font-size: 12px; border-radius: 4px; padding: 1px 4px; text-align: right; font-variant-numeric: tabular-nums; }

/* Detail panel */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; color: var(--ink-2); }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 14px; }
.mgrid > div { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
.mgrid .l { font-size: 11px; color: var(--ink-2); }
.mgrid .v { font-size: 17px; font-weight: 600; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 3px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-pressed="true"] { border-color: var(--ink); }
.stack { display: flex; gap: 2px; height: 14px; }
.stack div { min-width: 0; border-radius: 2px; }
.stackrow { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; margin: 4px 0; font-size: 12px; color: var(--ink-2); }
.ptable { font-size: 12.5px; margin-top: 6px; }
.ptable th, .ptable td { padding: 3px 6px; }
.ptable thead th { position: static; }
dl.meta { display: grid; grid-template-columns: 120px 1fr; gap: 3px 10px; font-size: 12.5px; margin: 6px 0 0; }
dl.meta dt { color: var(--ink-2); }
dl.meta dd { margin: 0; overflow-wrap: anywhere; }
.subhead { margin: 16px 0 6px; font-size: 13px; font-weight: 600; }
.linkbtn { all: unset; cursor: pointer; color: var(--ink); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
.linkbtn:focus-visible { outline: 2px solid var(--accent); }

/* Folds */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.minicard { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.ftable td, .ftable th { font-size: 12.5px; white-space: nowrap; }
.ftable thead th { position: static; }
.ftable tfoot td { font-weight: 600; border-top: 1px solid var(--axis); }
.scroll-x { overflow-x: auto; }
svg text { fill: var(--ink-2); font-size: 11px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }

/* Tooltip */
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); padding: 8px 10px; font-size: 12px; max-width: 340px; display: none; }
#tip .v { font-size: 15px; font-weight: 600; }
#tip .r { display: flex; align-items: center; gap: 6px; }
.notes li { margin: 3px 0; }
.notes { font-size: 13px; color: var(--ink-2); }
.notes code { font-size: 12px; }
@media print { .controls { position: static; } .table-wrap { max-height: none; overflow: visible; } .detail { position: static; max-height: none; } }
</style>

<body>
<div class="wrap">
  <header class="page-head">
    <div>
      <h1 id="title"></h1>
      <p id="subtitle" class="ink2"></p>
      <p id="generated" class="muted small"></p>
    </div>
    <button id="theme" class="btn small" type="button"></button>
  </header>

  <nav class="controls" id="controls" aria-label="Filters"></nav>

  <section class="card section" id="overview">
    <div class="section-head"><h2 id="ov-title"></h2><span id="ov-note" class="muted small"></span></div>
    <div class="tiles" id="tiles"></div>
    <div class="legend" id="strip-legend"></div>
    <div id="strip" style="margin-top:6px"></div>
  </section>

  <div class="layout">
    <section class="card" id="slides">
      <div class="section-head"><h2 id="tbl-title"></h2><span class="muted small">Click a row (or a dot above) for the slide's confusion matrix. ↑/↓ move between rows.</span></div>
      <div class="legend" id="tbl-legend" style="margin-bottom:8px"></div>
      <div class="table-wrap"><table id="tbl"></table></div>
    </section>
    <aside class="card detail" id="detail" aria-live="polite"></aside>
  </div>

  <section class="card section" id="folds"></section>
  <section class="card section notes" id="notes"></section>
</div>
<div id="tip" role="tooltip"></div>

<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('report-data').textContent);
const C = D.class_names, K = C.length, RUNS = D.runs, MULTI = RUNS.length > 1;
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = sel => document.querySelector(sel);

// ---------- DOM helpers (all text goes through text nodes) ----------
function setAttrs(n, attrs) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.setAttribute('class', v);
    else if (k === 'style') for (const [p, val] of Object.entries(v)) { if (val != null) n.style.setProperty(p.startsWith('--') ? p : p.replace(/[A-Z]/g, c => '-' + c.toLowerCase()), val); }
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
}
function append(n, kids) {
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
function h(tag, attrs, ...kids) { const n = document.createElement(tag); setAttrs(n, attrs); return append(n, kids); }
function sv(tag, attrs, ...kids) { const n = document.createElementNS(SVGNS, tag); setAttrs(n, attrs); return append(n, kids); }

// ---------- formatting ----------
const fmt = (v, d = 3) => (v == null || !isFinite(v)) ? '–' : v.toFixed(d);
const fmtInt = v => v == null ? '–' : Math.round(v).toLocaleString('en-US');
const compact = v => v == null ? '–' : v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'K' : String(v);
const fmtDur = s => s == null ? '–' : s >= 3600 ? `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')} min` : `${Math.round(s / 60)} min`;
const pct = v => v == null ? '–' : (100 * v).toFixed(v < 0.1 ? 1 : 0) + '%';
const mean = a => { const b = a.filter(v => v != null && isFinite(v)); return b.length ? b.reduce((x, y) => x + y, 0) / b.length : null; };
const LW = { none: 'none', by_wsi: 'by slide', by_cell_type: 'by cell type' };

// ---------- colour ----------
const RAMP = ['#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95', '#104281', '#0d366b'];
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const rgb = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
function relLum(c) { const f = x => { x /= 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); }
function seq(v) {  // sequential blue; near zero recedes toward the surface in both modes
  const r = isDark() ? RAMP.slice().reverse() : RAMP;
  v = Math.max(0, Math.min(1, v));
  const p = v * (r.length - 1), i = Math.min(r.length - 2, Math.floor(p)), t = p - i;
  const a = rgb(r[i]), b = rgb(r[i + 1]), c = a.map((x, j) => Math.round(x + (b[j] - x) * t));
  const L = relLum(c);
  return { fill: `rgb(${c.join(',')})`, ink: (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? '#0b0b0b' : '#ffffff' };
}
const runColor = ri => `var(--s${(ri % 8) + 1})`;
const clsColor = i => `var(--s${(i % 8) + 1})`;

// ---------- tooltip ----------
const tip = $('#tip');
function showTip(evt, ...kids) {
  tip.replaceChildren(); append(tip, kids); tip.style.display = 'block';
  const r = evt.target.getBoundingClientRect ? evt.target.getBoundingClientRect() : null;
  const x = evt.clientX ?? (r ? r.right : 0), y = evt.clientY ?? (r ? r.top : 0);
  const w = tip.offsetWidth, hgt = tip.offsetHeight;
  let left = x + 14, top = y + 14;
  if (left + w > innerWidth - 8) left = Math.max(8, x - w - 14);
  if (top + hgt > innerHeight - 8) top = Math.max(8, y - hgt - 14);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };
function hoverable(node, content) {
  node.addEventListener('pointermove', e => showTip(e, ...content()));
  node.addEventListener('pointerleave', hideTip);
  node.addEventListener('focus', e => showTip(e, ...content()));
  node.addEventListener('blur', hideTip);
  return node;
}

// ---------- data index ----------
const METRICS = [
  { key: 'macro_f1_present', label: 'Macro F1 (classes present)', short: 'macro F1', hi: true },
  { key: 'macro_f1', label: `Macro F1 (all ${K} classes)`, short: 'macro F1 (all)', hi: true },
  { key: 'balanced_accuracy', label: 'Balanced accuracy', short: 'bal. acc.', hi: true },
  { key: 'accuracy', label: 'Accuracy', short: 'accuracy', hi: true },
  { key: 'weighted_f1', label: 'Weighted F1', short: 'weighted F1', hi: true },
  { key: 'ce_loss', label: 'Cross-entropy loss', short: 'CE loss', hi: false, unbounded: true },
  ...C.map((c, i) => ({ key: 'f1_' + i, label: `F1 · ${c}`, short: `F1 ${c}`, hi: true, cls: i })),
];
const metricDef = () => METRICS.find(m => m.key === state.metric);
const mval = (row, m) => !row ? null : m.cls != null ? (row.n[m.cls] > 0 ? row.f1[m.cls] : null) : row[m.key];

const ENTRIES = [], BYKEY = new Map();
RUNS.forEach((run, ri) => run.slides.forEach(sl => {
  const key = `${sl.set}|${sl.fold}|${sl.wsi}`;
  let e = BYKEY.get(key);
  if (!e) { e = { key, set: sl.set, fold: sl.fold, wsi: sl.wsi, cohort: sl.cohort, meta: D.meta[sl.wsi] || {}, by: [] }; BYKEY.set(key, e); ENTRIES.push(e); }
  e.by[ri] = sl;
}));
const COHORT_ORDER = [];
RUNS.forEach(run => run.folds.forEach(f => f.test_cohorts.forEach(c => { if (!COHORT_ORDER.includes(c)) COHORT_ORDER.push(c); })));
const ALL_FOLDS = [...new Set(RUNS.flatMap(r => r.folds.map(f => f.fold)))].sort((a, b) => a - b);
const foldOf = (ri, k) => RUNS[ri].folds.find(f => f.fold === k);
function heldOut(k) { for (const run of RUNS) { const f = run.folds.find(f => f.fold === k); if (f) return f.test_cohorts.join('+'); } return '?'; }
const tissueOf = e => e.meta.tissue ? e.meta.tissue.replace(/\s*\(.*\)\s*$/, '') : 'unknown tissue';
const diseaseOf = e => [e.meta.disease_type || e.meta.disease_state, e.meta.subtype].filter(Boolean).join(' · ') || 'unknown';
const cellsOf = e => { const r = e.by.find(Boolean); return r ? r.n_cells : null; };
const searchText = e => [e.wsi, e.cohort, e.meta.tissue, e.meta.disease_state, e.meta.disease_type, e.meta.subtype, e.meta.donor, e.meta.site].filter(Boolean).join(' ').toLowerCase();

function cmStats(cm) {
  const rows = cm.map(r => r.reduce((a, b) => a + b, 0));
  const cols = cm[0].map((_, j) => cm.reduce((a, r) => a + r[j], 0));
  const tot = rows.reduce((a, b) => a + b, 0);
  const per = cm.map((r, i) => ({
    n: rows[i], pred: cols[i], prec: cols[i] ? r[i] / cols[i] : null, rec: rows[i] ? r[i] / rows[i] : null,
    f1: rows[i] + cols[i] ? 2 * r[i] / (rows[i] + cols[i]) : null,
  }));
  return { rows, cols, tot, per };
}
function pooledVal(fold, set, m) {
  const blk = fold && fold[set]; if (!blk) return null;
  if (m.cls != null) { if (!blk.cm) return null; const p = cmStats(blk.cm).per[m.cls]; return p.n > 0 ? p.f1 : null; }
  return blk.pooled[m.key === 'ce_loss' ? 'loss' : m.key] ?? null;
}

// ---------- state ----------
const state = {
  set: 'test', metric: 'macro_f1_present', group: 'cohort', query: '',
  sort: { key: 'metric', dir: -1 }, visible: RUNS.map(() => true), ref: 0, selected: null, detailRun: null,
};
const visRuns = () => RUNS.map((_, i) => i).filter(i => state.visible[i]);

const GROUPS = {
  cohort: { label: 'Cohort', key: e => e.cohort || '—', name: g => g },
  fold: { label: 'Fold', key: e => 'f' + e.fold, name: g => `Fold ${g.slice(1)} · ${heldOut(+g.slice(1))} held out` },
  tissue: { label: 'Tissue', key: tissueOf, name: g => g },
  disease: { label: 'Disease state', key: e => e.meta.disease_state || 'unknown', name: g => g },

    } else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(rowsEl[i].dataset.key, false); }
  });

}

function select(key, scroll) {
  state.selected = key;
  document.querySelectorAll('#tbl tr.row').forEach(tr => { const on = tr.dataset.key === key; tr.classList.toggle('sel', on); tr.tabIndex = on ? 0 : -1; });
  if (scroll) { const tr = document.querySelector(`#tbl tr.row[data-key="${CSS.escape(key)}"]`); if (tr) tr.scrollIntoView({ block: 'nearest' }); }

// ---------- confusion matrix ----------
let svgUid = 0;
function cmSvg(cm, { cell = 46, showLabels = true, font = 11 } = {}) {
  const st = cmStats(cm), uid = 'h' + (++svgUid);
  const lw = showLabels ? 76 : 30, th = showLabels ? 34 : 18, W = lw + K * cell, H = th + K * cell;
  // Scales down with its container (small-multiple cards, phone widths), never up.
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Confusion matrix, rows true class, columns predicted class, shaded by fraction of the true class',
    style: { width: '100%', 'max-width': W + 'px', height: 'auto', display: 'block' } });
  const pat = sv('pattern', { id: uid, width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, sv('line', { x1: 0, y1: 0, x2: 0, y2: 6, style: { stroke: 'var(--hatch)', 'stroke-width': 1.5 } }));
  svg.append(sv('defs', null, pat));
  svg.append(sv('text', { x: lw + K * cell / 2, y: 10, 'text-anchor': 'middle', style: { fill: 'var(--muted)' } }, 'predicted →'));
  C.forEach((c, j) => svg.append(sv('text', { x: lw + j * cell + cell / 2, y: th - 6, 'text-anchor': 'middle', style: { 'font-size': font + 'px' } }, showLabels ? c.slice(0, 4) + (c.length > 4 ? '.' : '') : c[0], sv('title', null, c))));
  cm.forEach((row, i) => {
    const y = th + i * cell;
    svg.append(sv('text', { x: lw - 6, y: y + cell / 2 + 4, 'text-anchor': 'end', style: { 'font-size': font + 'px' } }, showLabels ? c_trunc(C[i]) : C[i][0], sv('title', null, `true ${C[i]}`)));
    if (!st.rows[i]) {
      const g = sv('g', { tabindex: -1 });
      g.append(sv('rect', { x: lw + 1, y: y + 1, width: K * cell - 2, height: cell - 2, rx: 2, style: { fill: `url(#${uid})` } }));
      if (showLabels) g.append(sv('text', { x: lw + K * cell / 2, y: y + cell / 2 + 4, 'text-anchor': 'middle', style: { fill: 'var(--muted)' } }, `no true ${C[i]} cells`));
      hoverable(g, () => [h('div', { class: 'v' }, `no true ${C[i]} cells`), h('div', { class: 'muted' }, 'row left empty')]);
      svg.append(g);
      return;
    }
    row.forEach((n, j) => {
      const f = n / st.rows[i], c = seq(f), g = sv('g', { tabindex: -1 });
      g.append(sv('rect', { x: lw + j * cell + 1, y: y + 1, width: cell - 2, height: cell - 2, rx: 2, style: { fill: c.fill, stroke: i === j ? 'var(--ink)' : 'none', 'stroke-width': i === j ? 1 : 0 } }));
      if (cell >= 26) g.append(sv('text', { x: lw + j * cell + cell / 2, y: y + cell / 2 + 4, 'text-anchor': 'middle', style: { fill: c.ink, 'font-size': (cell >= 40 ? 12 : 10) + 'px' } }, cell >= 40 ? pct(f) : Math.round(100 * f)));
      hoverable(g, () => [h('div', { class: 'v' }, `${pct(f)} of true ${C[i]}`), h('div', null, `${fmtInt(n)} of ${fmtInt(st.rows[i])} cells predicted ${C[j]}`)]);
      svg.append(g);
    });
  });
  return svg;
}
const c_trunc = s => s.length > 11 ? s.slice(0, 10) + '.' : s;

function stackBar(counts, total, label) {
  const bar = h('div', { class: 'stack' });
  counts.forEach((n, i) => { if (!n) return; const seg = h('div', { style: { flex: `${n} 1 0`, background: clsColor(i) }, tabindex: -1 }); hoverable(seg, () => [h('div', { class: 'v' }, pct(n / total)), h('div', null, `${label} ${C[i]}: ${fmtInt(n)} cells`)]); bar.append(seg); });
  return bar;
}

// ---------- line chart (fold curves) ----------
function lineChart({ series, width, height = 130, marker = null, label }) {
  const m = { l: 40, r: 44, t: 8, b: 22 }, W = width, H = height;
  const n = Math.max(...series.map(s => s.values.length));
  const all = series.flatMap(s => s.values).filter(v => v != null);
  if (!all.length || n < 1) return h('p', { class: 'muted small' }, 'no curve saved');
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.05 || 0.01; lo -= pad; hi += pad;
  const X = i => m.l + (n <= 1 ? (W - m.l - m.r) / 2 : i / (n - 1) * (W - m.l - m.r)), Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': label });
  const yt = [lo + pad, (lo + hi) / 2, hi - pad], d = (hi - lo) < 0.05 ? 3 : 2;
  yt.forEach(v => { svg.append(sv('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) })); svg.append(sv('text', { x: m.l - 5, y: Y(v) + 4, 'text-anchor': 'end' }, v.toFixed(d))); });
  svg.append(sv('line', { class: 'axis', x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }));
  const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step) svg.append(sv('text', { x: X(i), y: H - 6, 'text-anchor': 'middle' }, String(i + 1)));
  if (marker) {
    svg.append(sv('line', { x1: X(marker.i), x2: X(marker.i), y1: m.t, y2: H - m.b, style: { stroke: 'var(--axis)', 'stroke-width': 1 } }));
  }
  series.forEach(s => {
    const pts = s.values.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
    svg.append(sv('path', { d: pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(''), style: { fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' } }));
    if (s.endLabel && pts.length) svg.append(sv('text', { x: pts[pts.length - 1][0] + 5, y: pts[pts.length - 1][1] + 4 }, s.endLabel));
  });
  if (marker) {
    const s0 = series[0], v = s0.values[marker.i];
    if (v != null) svg.append(sv('circle', { cx: X(marker.i), cy: Y(v), r: 4, style: { fill: s0.color, stroke: 'var(--surface)', 'stroke-width': 2 } }));
  }
  const hair = sv('line', { y1: m.t, y2: H - m.b, style: { stroke: 'var(--ink-2)', 'stroke-width': 1, display: 'none' } });
  svg.append(hair);
  const overlay = sv('rect', { x: m.l - 6, y: 0, width: W - m.l - m.r + 12, height: H, fill: 'transparent' });
  overlay.addEventListener('pointermove', ev => {
    const bb = svg.getBoundingClientRect(), px = (ev.clientX - bb.left) * (W / bb.width);
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / ((W - m.l - m.r) / Math.max(1, n - 1)))));
    hair.setAttribute('x1', X(i)); hair.setAttribute('x2', X(i)); hair.style.display = '';
    showTip(ev, h('div', { class: 'muted' }, `epoch ${i + 1}${marker && marker.i === i ? ' · selected' : ''}`),
      series.map(s => h('div', { class: 'r' }, h('span', { class: 'linekey', style: { background: s.color } }), h('b', null, fmt(s.values[i], 4)), h('span', { class: 'muted' }, s.name))));
  });
  overlay.addEventListener('pointerleave', () => { hair.style.display = 'none'; hideTip(); });
  svg.append(overlay);
  return svg;
}

    h('li', null, h('b', null, 'Macro F1 (classes present)'), ' averages the per-class F1 over the classes that have at least one true cell in the slide. This is the per-slide score used for model selection. ', h('b', null, `Macro F1 (all ${K})`), ' counts absent classes as 0, so it is low by construction on slides that lack some classes.'),
    h('li', null, 'Per-class heat cells show F1 for the classes present in the slide. Hatched cells mark classes the slide does not contain; their stored F1 of 0 is not a score. Hover a cell to see how many cells were predicted as that class anyway.'),
    h('li', null, '"Pooled" metrics score all cells of a held-out cohort at once, so large slides dominate them. "Slide-mean" averages the per-slide scores with each slide weighted equally.'),
    h('li', null, 'Val selection score = the run\'s training.selection_metric on the fold\'s val slides (cohort-balanced: the mean over val cohorts of their slide-mean macro F1). It chooses both the epoch (early stopping) and the trial.')));
  host.append(h('h3', { style: { 'margin-top': '12px' } }, 'Run settings'));
  RUNS.forEach((run, ri) => {
    const s = run.settings || {}, hp = s.hparams || {}, prov = run.folds.map(f => f.provenance || {});
    const commits = [...new Set(prov.map(p => p.git_commit && p.git_commit.slice(0, 7)).filter(Boolean))];
    const times = prov.map(p => p.timestamp).filter(Boolean).sort();
    const items = [
      ['Run', run.full_label], ['Path', run.id], ['Mapping', s.mapping], ['Read-out', (s.embeddings_datasets || []).join(', ')],
      ['Matching only', String(s.consider_matching)], ['Cells per slide cap', s.max_cells_per_wsi == null ? 'none (all cells)' : String(s.max_cells_per_wsi)],
      ['Hyper-parameters', Object.entries(hp).map(([k, v]) => `${k}=${Array.isArray(v) ? '[' + v.join(', ') + ']' : v}`).join(' · ')],
      ['Training', `≤${s.num_epochs} epochs, batch ${s.batch_size}, early stopping patience ${s.early_stopping?.patience ?? '–'}, selection ${s.selection_metric}, seed ${s.seed}`],
      ['Trained from', `${commits.join(', ') || '–'}${prov.some(p => p.git_dirty) ? ' (with uncommitted changes)' : ''}${times.length ? `, ${times[0].replace('T', ' ')} → ${times[times.length - 1].replace('T', ' ')}` : ''}`],
    ].filter(([, v]) => v != null && v !== '');
    host.append(h('div', { class: 'key', style: { margin: '6px 0 2px', color: 'var(--ink)', 'font-weight': 600 } }, MULTI ? h('span', { class: 'dot', style: { background: runColor(ri) } }) : null, run.label));
    host.append(h('dl', { class: 'meta', style: { 'grid-template-columns': '150px 1fr' } }, items.map(([k, v]) => [h('dt', null, k), h('dd', null, v)])));
  });
}

// ---------- CSV ----------
function downloadCsv() {
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const scal = ['n_cells', 'accuracy', 'balanced_accuracy', 'macro_f1', 'macro_f1_present', 'weighted_f1', 'ce_loss'];
  const runCols = RUNS.flatMap(r => [...scal, ...C.map(c => 'f1_' + c), ...C.map(c => 'n_' + c)].map(c => MULTI ? `${r.label} | ${c}` : c));
  const head = ['set', 'fold', 'held_out', 'wsi', 'cohort', 'tissue', 'disease_state', 'disease_type', 'subtype', 'donor', ...runCols];
  const lines = [head.map(q).join(',')];
  for (const e of filteredRows()) {
    const base = [e.set, e.fold, heldOut(e.fold), e.wsi, e.cohort, e.meta.tissue, e.meta.disease_state, e.meta.disease_type, e.meta.subtype, e.meta.donor];
    const vals = RUNS.flatMap((_, ri) => { const r = e.by[ri]; return r ? [...scal.map(k => r[k]), ...r.f1.map((f, i) => r.n[i] ? f : ''), ...r.n] : Array(scal.length + 2 * K).fill(''); });
    lines.push([...base, ...vals].map(q).join(','));
  }
  const a = h('a', { href: URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })), download: `${D.experiment}_${state.set}_per_slide.csv` });
  document.body.append(a); a.click(); a.remove();
}

// ---------- theme ----------
const THEMES = ['auto', 'light', 'dark'];
function getTheme() { try { return localStorage.getItem('results-report-theme') || 'auto'; } catch { return 'auto'; } }
function applyTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  $('#theme').textContent = `Theme: ${t}`;
  try { localStorage.setItem('results-report-theme', t); } catch { /* storage unavailable */ }
}
$('#theme').addEventListener('click', () => { applyTheme(THEMES[(THEMES.indexOf(getTheme()) + 1) % 3]); renderData(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderData());

// ---------- render ----------
function renderData() {
  const m = metricDef();
  $('#ov-title').textContent = `${m.label} per slide, by ${GROUPS[state.group].label.toLowerCase()}`;
  $('#ov-note').textContent = state.set === 'test' ? 'Test slides: each scored by the fold that held out its cohort.' : 'Val slides: a slide appears once per fold it validates.';
  const rows = filteredRows();
  if (!rows.some(e => e.key === state.selected)) {
    const g = groupRows(rows); state.selected = g.length && g[0].rows.length ? g[0].rows[0].key : null;
  }
  renderTiles(); renderStrip(); renderTable(); renderDetail(); renderFolds();
}
applyTheme(getTheme());
renderHeader(); renderControls(); renderNotes(); renderData();
let rz, stripW = $('#strip').clientWidth;
new ResizeObserver(() => {
  const w = $('#strip').clientWidth; if (w === stripW) return; stripW = w;
  cancelAnimationFrame(rz); rz = requestAnimationFrame(renderStrip);
}).observe($('#strip'));
let lastW = innerWidth; addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) > 40) { lastW = innerWidth; renderFolds(); } });
</script>
